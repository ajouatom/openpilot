name: Signal integration checks
on:
  push:
    branches: [carrot-wip]
    paths:
      - 'opendbc_repo/**'
      - 'openpilot/cereal/log.capnp'
      - 'openpilot/selfdrive/car/**'
      - 'openpilot/selfdrive/controls/**'
      - 'openpilot/selfdrive/modeld/modeld.py'
      - 'openpilot/selfdrive/carrot/xiaoge_data.py'
      - 'openpilot/selfdrive/carrot/assistant_speed.py'
      - 'openpilot/selfdrive/carrot/tests/test_xiaoge_data.py'
      - 'tools/signal_validation/**'
      - '.github/workflows/signal-checks.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install Cython==3.2.9 setuptools scons pytest pytest-subtests numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial parameterized jeepney
      - name: Build production CAN kernels and safety hooks
        run: |
          scons -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
          cd opendbc_repo/opendbc/safety
          gcc -shared -fPIC -Wall -Werror -nostdlib -fno-builtin -std=gnu11 -Wfatal-errors -Wno-pointer-to-int-cast \
            -I. -Iboard tests/libsafety/safety.c -o tests/libsafety/libsafety.so
      - name: Tesla intent, card, feedback, native safety and existing Ioniq indicators
        run: |
          python tools/signal_validation/run.py \
            openpilot/selfdrive/car/tests/test_camera_scc_steering_intent.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_carstate_buttons.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_pedal_interceptor.py \
            opendbc_repo/opendbc/safety/tests/test_pedal_interceptor.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_alt2_adas_buttons.py \
            opendbc_repo/opendbc/safety/tests/test_hyundai_canfd_alt_buttons.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_spas.py \
            opendbc_repo/opendbc/safety/tests/test_hyundai_spas.py \
            openpilot/selfdrive/car/tests/test_hyundai_spas.py \
            openpilot/selfdrive/car/tests/test_spas_interface.py \
            opendbc_repo/opendbc/car/tesla/tests \
            opendbc_repo/opendbc/safety/tests/test_tesla.py \
            opendbc_repo/opendbc/safety/tests/test_tesla_turn_signals.py \
            openpilot/selfdrive/car/tests/test_tesla_turn_signals.py \
            openpilot/selfdrive/car/tests/test_tesla_signal_card.py \
            openpilot/selfdrive/car/tests/test_tesla_lane_signals.py \
            openpilot/selfdrive/controls/tests/test_tesla_auto_signal_intent.py \
            openpilot/selfdrive/controls/tests/test_tesla_turn_journey.py \
            openpilot/selfdrive/controls/tests/test_tesla_traffic_stop.py \
            openpilot/selfdrive/controls/tests/test_desire_helper_stalk.py \
            openpilot/selfdrive/controls/tests/test_assistant_lane.py \
            openpilot/selfdrive/car/tests/test_assistant_speed.py \
            openpilot/selfdrive/controls/tests/test_lever_forced_turn.py \
            openpilot/selfdrive/carrot/tests/test_xiaoge_data.py \
            tools/signal_validation/test_trial_integration.py \
            tools/signal_validation/test_lane_line_time.py \
            tools/jetlink/test_blinker.py tools/jetlink/test_blinker_auto.py
      - name: Pedal protocol on the Python CAN backend
        env:
          CARROT_NATIVE_CPU: '0'
        run: python tools/signal_validation/run.py opendbc_repo/opendbc/car/hyundai/tests/test_pedal_interceptor.py
      - name: CAN FD Kick ownership, stock handover and stop-go regressions
        run: |
          python tools/signal_validation/run.py \
            openpilot/selfdrive/car/tests/test_hyundai_kick.py \
            tools/jetlink/test_blinker_boundary.py \
            tools/jetlink/test_manual_turn_indicator.py \
            tools/jetlink/test_indicator_reconstruction.py \
            openpilot/selfdrive/car/tests/test_card_diagnostics.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_aprk_blinkers.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_camera_set_speed_sync.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_ccnc_cluster.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_lane_crossing.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stock_cruise_adopt.py \
            opendbc_repo/opendbc/safety/tests/test_hyundai_canfd_spas_piggyback.py \
            openpilot/selfdrive/carrot/tests/test_radar_moving_lead_shield.py \
            openpilot/selfdrive/carrot/tests/test_red_stop_hold.py \
            openpilot/selfdrive/controls/tests/test_stop_go_assist.py \
            openpilot/selfdrive/controls/tests/test_lead_close_brake.py
          python tools/signal_validation/run.py \
            openpilot/selfdrive/carrot/bluetooth/tests/test_b1.py tools/jetlink/test_blink_owner.py
      - name: Vehicle fault admission and CAN FD signal-stop object
        run: |
          python tools/signal_validation/run.py \
            openpilot/selfdrive/controls/tests/test_controlsd_publish.py \
            openpilot/selfdrive/controls/tests/test_longcontrol_hyundai_tuning.py \
            openpilot/selfdrive/selfdrived/tests/test_vehicle_faults.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_casper_fault_reporting.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stop_object.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stopping.py \
            openpilot/selfdrive/ui/tests/test_stop_object.py
