name: tests

on:
  push:
    branches:
      - carrot-wip
  #pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/carrot-wip' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1

jobs:
  git_update:
    name: Git update lifecycle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest aiohttp
      - name: Check startup, locking, recovery and subprocess cleanup
        run: |
          bash -n launch_chffrplus.sh
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/common/tests openpilot/common/tests/test_repo_update.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/server/tests openpilot/selfdrive/carrot/server/tests/test_auto_update.py openpilot/selfdrive/carrot/server/tests/test_git_config.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/system/tests openpilot/system/tests/test_launch_order.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/system/updated/tests openpilot/system/updated/tests/test_process.py

  build_release:
    name: build release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: ./tools/op.sh setup
      - name: Build openpilot
        run: scons
      - name: Check passive camera SOF diagnostics
        run: openpilot/system/camerad/test/test_camera_event_timing
      - name: Check coherent OS04C10 exposure updates
        run: openpilot/system/camerad/test/test_os04c10_exposure
      - name: Check model, monitoring and Bluetooth integration
        run: |
          python -m pytest -o addopts='' -q \
            openpilot/selfdrive/monitoring/test_monitoring.py \
            openpilot/selfdrive/modeld/tests/test_big_model.py \
            openpilot/selfdrive/modeld/tests/test_precompiled_model.py \
            openpilot/selfdrive/modeld/tests/test_precompiled_runner.py \
            openpilot/selfdrive/modeld/tests/test_precompiled_validation.py \
            openpilot/system/tests/test_model_build_cache.py \
            openpilot/system/tests/test_panda_firmware_version.py \
            openpilot/selfdrive/modeld/tests/test_generic_model_runtime.py \
            openpilot/selfdrive/modeld/tests/test_dmonitoring_artifact.py \
            openpilot/selfdrive/modeld/tests/test_camera_sync.py \
            openpilot/selfdrive/carrot/tests/test_radarcan_process.py \
            openpilot/selfdrive/carrot/tests/test_radar_can_batch.py \
            openpilot/selfdrive/carrot/tests/test_radar_cutout_fast_path.py \
            openpilot/selfdrive/carrot/tests/test_cluster_performance_safeguards.py \
            openpilot/selfdrive/carrot/tests/test_cluster_autorun.py \
            openpilot/selfdrive/controls/tests/test_leads.py \
            openpilot/selfdrive/carrot/bluetooth/tests \
            openpilot/selfdrive/car/tests/test_carrot_cruise_buttons.py \
            opendbc_repo/opendbc/car/volkswagen/tests/test_carstate_buttons.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stopping.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_jerk.py \
            openpilot/selfdrive/controls/tests/test_desire_helper.py \
            openpilot/system/tests/test_c3_agnos_manifest.py

  model_web:
    name: Model and Bluetooth web controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test openpilot/selfdrive/carrot/web/tests/bluetooth_mapping.test.mjs openpilot/selfdrive/carrot/web/tests/egpu_model.test.mjs openpilot/selfdrive/carrot/web/tests/viewport_keyboard.test.mjs openpilot/selfdrive/carrot/web/tests/settings_parent_navigation.test.mjs
