name: Jetson integration checks
on:
  push:
    branches: [carrot-wip]
    paths:
      - "openpilot/common/runtime_diagnostics.py"
      - "openpilot/common/tests/test_runtime_diagnostics.py"
      - "openpilot/system/ui/lib/egl.py"
      - "openpilot/system/ui/lib/application.py"
      - "openpilot/selfdrive/ui/tests/test_egl_shutdown.py"
      - 'tools/jetlink/**'
      - 'third_party/jetlink/**'
      - 'openpilot/common/jetlink_status.py'
      - 'openpilot/common/jetlink_peer.py'
      - 'openpilot/selfdrive/modeld/**'
      - 'openpilot/selfdrive/carrot/carrot_navi.py'
      - 'openpilot/selfdrive/carrot/cluster/cluster_h264_pipeline.py'
      - 'openpilot/selfdrive/carrot/cluster/main.py'
      - 'openpilot/selfdrive/carrot/tests/test_cluster_ffmpeg_threads.py'
      - '.github/workflows/jetlink-checks.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check installer disk selection without opening devices
        shell: powershell
        run: tools/jetlink/windows_installer/test_disks.ps1
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 pytest-asyncio zstandard numpy pillow pycapnp pycryptodome aiohttp raylib==5.5.0.4 setproctitle requests pyserial
      - name: Software HUD encoder frame and geometry checks
        env:
          PYTHONPATH: .:opendbc_repo:tools/jetlink
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_cluster_ffmpeg_threads.py \
            openpilot/selfdrive/carrot/tests/test_cluster_h264_complexity.py \
            openpilot/selfdrive/carrot/tests/test_cluster_performance_safeguards.py \
            openpilot/selfdrive/carrot/tests/test_cluster_usb_rate.py
      - name: USB, fallback, navigation, Wi-Fi, signed updates and image checks
        env:
          PYTHONPATH: .:opendbc_repo:tools/jetlink
        run: |
          python -m compileall -q tools/jetlink openpilot/selfdrive/modeld/jetlink
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink -q \
            tools/jetlink openpilot/selfdrive/modeld/tests/test_jetlink.py \
            openpilot/common/tests/test_runtime_diagnostics.py \
            openpilot/selfdrive/ui/tests/test_egl_shutdown.py \
            openpilot/selfdrive/modeld/tests/test_camera_sync.py \
            openpilot/selfdrive/modeld/tests/test_camera_gap.py \
            openpilot/selfdrive/modeld/tests/test_jetlink_phase.py \
            openpilot/selfdrive/modeld/tests/test_jetlink_mac.py
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_carrot_navi.py \
            openpilot/selfdrive/carrot/tests/test_cluster_scene.py
      - name: Protected storage with real loop filesystem and isolated mounts
        run: |
          sudo --preserve-env=PATH unshare --mount --propagation private env CARROT_STORAGE_MOUNTS=1 \
            "$(which python)" -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink -q \
            tools/jetlink/test_protected_storage.py
