services:
  carrot-upload:
    build: .
    image: carrot-upload:1.0.2
    restart: unless-stopped
    init: true
    environment:
      CARROT_UPLOAD_ROOT: /data/openpilot
      CARROT_UPLOAD_DB: /data/openpilot/tmux/.state/uploads.sqlite3
      CARROT_DAILY_DEVICE_QUOTA_BYTES: "1073741824"
      CARROT_DAILY_IP_QUOTA_BYTES: "8589934592"
      CARROT_MAX_FILE_BYTES: "536870912"
      CARROT_MIN_FREE_BYTES: "10737418240"
      CARROT_SESSION_TTL_SECONDS: "14400"
      CARROT_CONCURRENT_PER_DEVICE: "3"
      CARROT_CONCURRENT_GLOBAL: "16"
    ports:
      - "127.0.0.1:18080:8080"
    user: "1026:100"
    group_add:
      - "101"
    volumes:
      - /volume1/openpilot/routes:/data/openpilot/routes
      - /volume1/openpilot/tmux:/data/openpilot/tmux
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
