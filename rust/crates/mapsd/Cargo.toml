[package]
name = "openpilot-mapsd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
native = ["dep:ureq", "dep:openpilot-messaging", "dep:openpilot-cereal", "dep:openpilot-params", "dep:signal-hook"]

[dependencies]
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.2", features = ["rustls"], optional = true }
openpilot-messaging = { path = "../messaging", optional = true }
openpilot-cereal = { path = "../cereal", optional = true }
openpilot-params = { path = "../params", optional = true }
signal-hook = { version = "0.3", optional = true }

[[bin]]
name = "openpilot-mapsd"
path = "src/main.rs"
required-features = ["native"]
